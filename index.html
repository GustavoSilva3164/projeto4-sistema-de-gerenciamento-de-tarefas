<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <div class="icone">☑</div>
      <h1>Gerenciador de Tarefas</h1>
    </header>

    <main>
      <section class="nova-tarefa">
        <h2>Nova Tarefa</h2>

        <div class="formulario">
          <input type="text" id="inputTarefa" placeholder="Digite uma tarefa...">
          <button id="btnAdicionar">Adicionar</button>
        </div>
      </section>

      <section class="area-tarefas">
        <div class="topo-lista">
          <h2>Suas Tarefas</h2>

          <div class="contador">
            <span>Total: <strong id="total">0</strong> tarefas</span>
            <span>Pendentes: <strong id="pendentes">0</strong></span>
            <span>Concluídas: <strong id="concluidas">0</strong></span>
          </div>
        </div>

        <ul id="listaTarefas"></ul>
      </section>
    </main>

    <footer>
      Desenvolvido com ❤️
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
